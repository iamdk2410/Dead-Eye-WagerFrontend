<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Dead-Eye Wager - Sign Up</title>
    <style>
        /* Basic styling for user feedback messages */
        .message {
            padding: 10px;
            margin-top: 1.5rem;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none; /* Hidden by default */
        }
        .success-message {
            color: #28a745;
            background-color: rgba(40, 167, 69, 0.1);
            border: 1px solid #28a745;
        }
        .error-message {
            color: #dc3545;
            background-color: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
        }
        /* Styling for the avatar selection section */
        .avatar-section { margin-top: 1.5rem; }
        .avatar-preview { border-radius: 50%; border: 3px solid #A0522D; margin-bottom: 1rem; }
        .avatar-grid { display: flex; justify-content: center; gap: 10px; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.3s; }
        .avatar-option.selected { border-color: #DAA520; /* Gold color for selected avatar */ }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Sign the Ledger</h1>
        <form id="registerForm">
            <div class="input-group">
                <label for="username">Your Alias (Username)</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Secret Word (Password)</label>
                <div class="pass">
                    <input type="password" id="password" name="password" required>
                    <span id="togglePassword">👁️</span>
                </div>
            </div>

            <div class="avatar-section">
                <label>Choose Your Mug</label>
                <img src="https://placehold.co/100x100/A0522D/FFF8E7?text=🤠" alt="Selected Avatar" class="avatar-preview" id="avatarPreview">
                <div class="avatar-grid">
                    <!-- Using placeholders for avatars -->
                    <img src="avatar1.jpg" alt="Avatar 1" class="avatar-option selected" title="Cowboy">
                    <img src="avatar2.jpg" alt="Avatar 2" class="avatar-option" title="Gentleman">
                    <img src="avatar3.jpg" alt="Avatar 3" class="avatar-option" title="Rancher">
                    <img src="avatar4.jpg" alt="Avatar 4" class="avatar-option" title="Outlaw">
                </div>
                <input type="hidden" id="avatar-url" name="avatar_url">
            </div>

            <div id="message" class="message"></div>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <div class="links">
             <a href="login.html">Already got an alias? Enter Saloon</a>
        </div>
    </div>

    <script>
        // --- Password Toggle ---
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // --- Avatar Selection ---
        const avatarOptions = document.querySelectorAll('.avatar-option');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarUrlInput = document.getElementById('avatar-url');

        // Set the initial avatar value on page load
        avatarPreview.src = avatarOptions[0].src;
        avatarUrlInput.value = avatarOptions[0].src;

        avatarOptions.forEach(option => {
            option.addEventListener('click', function() {
                // Update the preview image and hidden input value
                avatarPreview.src = this.src;
                avatarUrlInput.value = this.src;
                // Update which avatar has the 'selected' class
                avatarOptions.forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        // --- Registration Form Submission ---
        const registerForm = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent the form from reloading the page

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const avatarUrl = document.getElementById('avatar-url').value;

            // Clear any previous messages
            messageDiv.style.display = 'none';
            messageDiv.textContent = '';
            messageDiv.className = 'message';

            try {
                const response = await fetch('https://dead-eye-backend.onrender.com/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password, avatarUrl }),
                });

                const data = await response.json();

                if (!response.ok) {
                    // If the server returns an error, display it
                    throw new Error(data.message || 'Registration failed.');
                }

                // --- On Successful Registration ---
                messageDiv.textContent = 'Success! Redirecting to the Saloon...';
                messageDiv.classList.add('success-message');
                messageDiv.style.display = 'block';

                // Redirect to the login page after a short delay
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);

            } catch (error) {
                // Display any errors to the user
                messageDiv.textContent = error.message;
                messageDiv.classList.add('error-message');
                messageDiv.style.display = 'block';
                console.error('Registration Error:', error);
            }
        });
    </script>
</body>
</html>
